name: Release Check

# Full pre-release validation: pytest (functional suite against the Gradle
# fixture), pip-audit, build, and twine check.
#
# Runs on:
#   - pull_request to main — keeps every change honest.
#   - workflow_call        — reused as the gate by release-beta.yml and
#                            release-stable.yml; a red run blocks the release.
#   - workflow_dispatch    — run manually from the Actions tab.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    # Skip fork PRs (secrets/permissions aren't available); internal pushes,
    # reused calls, and manual runs always proceed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle distribution
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('tests/fixtures/sample-project/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run release-check
        run: bash scripts/release-check.sh
