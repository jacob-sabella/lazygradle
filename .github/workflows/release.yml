name: Release (Beta)

# Fires on every push to main that isn't a bot version-bump commit.
# Computes a CalVer tag (vYYYY.M.D.{run_number}), tags the merge commit,
# and creates a GitHub pre-release (beta).
#
# After 14 days promote-stable.yml flips it to a full release, which
# triggers python-publish.yml → PyPI (using the pyproject.toml version
# that was in the merged PR).

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute CalVer version
        id: ver
        run: |
          VERSION="$(date -u +'%Y.%-m.%-d').${{ github.run_number }}"
          echo "version=${VERSION}"        >> $GITHUB_OUTPUT
          echo "beta_tag=v${VERSION}-beta" >> $GITHUB_OUTPUT

      - name: Create and push beta tag
        run: |
          git tag "${{ steps.ver.outputs.beta_tag }}"
          git push origin "${{ steps.ver.outputs.beta_tag }}"

      - name: Create GitHub pre-release (beta)
        uses: actions/github-script@v7
        with:
          script: |
            const promoteDate = new Date(Date.now() + 14*24*60*60*1000)
              .toISOString().slice(0, 10);
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name:   '${{ steps.ver.outputs.beta_tag }}',
              name:        'Beta ${{ steps.ver.outputs.version }}',
              body: [
                '## Beta release — promotes to stable on ' + promoteDate,
                '',
                '**Commit**: ' + context.sha,
                '**Triggered by**: ' + context.actor,
              ].join('\n'),
              prerelease: true,
              draft:      false,
            });
