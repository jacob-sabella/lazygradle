name: Promote Beta to Stable

# Runs daily and promotes any beta GitHub release that is at least 14 days old
# to a stable release (prerelease: false).  A new stable tag is created pointing
# at the same commit so the two tags coexist:
#
#   v2026.6.27.42-beta  (kept for history)
#   v2026.6.27.42       (stable — triggers python-publish.yml → PyPI)
#
# Run workflow_dispatch from the Actions tab to promote immediately without waiting.

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote eligible beta releases
        uses: actions/github-script@v7
        with:
          script: |
            const BETA_SUFFIX = '-beta';
            const MIN_AGE_MS  = 14 * 24 * 60 * 60 * 1000;
            const cutoff      = new Date(Date.now() - MIN_AGE_MS);

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              per_page: 100,
            });

            const eligible = releases.filter(r =>
              r.prerelease &&
              r.tag_name.endsWith(BETA_SUFFIX) &&
              new Date(r.published_at) < cutoff
            );

            if (eligible.length === 0) {
              core.info('No beta releases ready for promotion.');
              return;
            }

            for (const beta of eligible) {
              const stableTag = beta.tag_name.slice(0, -BETA_SUFFIX.length);
              core.info(`Promoting ${beta.tag_name} → ${stableTag}`);

              // Resolve the commit the beta tag points at
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `tags/${beta.tag_name}`,
              });
              const sha = ref.object.type === 'tag'
                ? (await github.rest.git.getTag({ owner: context.repo.owner, repo: context.repo.repo, tag_sha: ref.object.sha })).data.object.sha
                : ref.object.sha;

              // Create stable tag at same commit
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `refs/tags/${stableTag}`,
                sha,
              });

              // Derive stable release notes from beta body
              const stableBody = beta.body
                .replace(/^## Beta release.*$/m, `## Stable release`)
                .replace(/\*\*Triggered by\*\*:.*\n?/, '');

              // Create stable release (triggers python-publish.yml via release: published)
              await github.rest.repos.createRelease({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                tag_name:   stableTag,
                name:       `Stable ${stableTag.replace(/^v/, '')}`,
                body:       stableBody,
                prerelease: false,
                draft:      false,
              });

              core.info(`✓ Stable release ${stableTag} created.`);
            }
