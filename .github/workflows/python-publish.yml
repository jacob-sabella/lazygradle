name: Upload Python Package

# Builds and uploads to PyPI whenever a GitHub Release is published — both
# betas (prerelease) and finals. The version is taken from the release tag
# (v1.3.0b412 -> 1.3.0b412) and written into pyproject.toml just before the
# build, so the tag, the release, and the PyPI artifact always agree. PEP 440
# pre-release rules keep betas out of `pip install lazygradle`; they surface
# only with `pip install --pre lazygradle`.
#
# Publishing uses PyPI Trusted Publishing (OIDC). This workflow's filename is
# registered as the project's trusted publisher, so keep it stable.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set package version from the release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          python scripts/set-version.py "${TAG#v}"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built artifacts match the release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED="${TAG#v}"
          if ! ls "dist/lazygradle-${EXPECTED}.tar.gz" >/dev/null 2>&1; then
            echo "::error::built artifacts do not match expected version ${EXPECTED}"
            ls -la dist
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
