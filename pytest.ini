[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

markers =
    unit: Unit tests for individual components
    integration: Integration tests across multiple components
    ui: UI tests using Textual's pilot framework
    slow: Tests that take a while to run
    requires_gradle: Tests that require a real Gradle installation

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv .idea screenshots .github
